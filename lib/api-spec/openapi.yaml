openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Quant Terminal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stock
    description: Stock data operations
  - name: market
    description: Market overview operations
  - name: universe
    description: Stock universe operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stock/{ticker}:
    get:
      operationId: getStockOverview
      tags: [stock]
      summary: Get stock overview with quant score
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stock overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockOverview"
        "404":
          description: Ticker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/history:
    get:
      operationId: getStockHistory
      tags: [stock]
      summary: Price history with technical indicators
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [ytd, 6mo, 1y, 2y, 5y]
            default: 1y
      responses:
        "200":
          description: Price history with indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockHistory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/fundamentals:
    get:
      operationId: getStockFundamentals
      tags: [stock]
      summary: Fundamental financial data
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fundamentals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fundamentals"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/news:
    get:
      operationId: getStockNews
      tags: [stock]
      summary: Latest news with sentiment analysis
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: News and sentiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsData"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/peers:
    get:
      operationId: getStockPeers
      tags: [stock]
      summary: Sector peers comparison with relative performance
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [1y, 5y]
            default: 1y
      responses:
        "200":
          description: Peers data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeersData"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/analyst:
    get:
      operationId: getStockAnalyst
      tags: [stock]
      summary: Analyst ratings and price targets
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analyst data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalystData"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stock/{ticker}/insider:
    get:
      operationId: getStockInsider
      tags: [stock]
      summary: Insider trading transactions and ownership
      parameters:
        - name: ticker
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Insider trading data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsiderData"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /market/pulse:
    get:
      operationId: getMarketPulse
      tags: [market]
      summary: Live market overview — indices, sectors, macro, fear gauge
      responses:
        "200":
          description: Market pulse data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPulse"
        "500":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /universe:
    get:
      operationId: getUniverse
      tags: [universe]
      summary: Full stock universe grouped by sector
      responses:
        "200":
          description: Universe
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UniverseSector"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    StockOverview:
      type: object
      required: [ticker, name, price, change, changePercent, quantScore, signal, sentimentScore, volume, avgVolume, rsi, ma50, ma200, macd, macdSignal, sector, beta]
      properties:
        ticker:
          type: string
        name:
          type: string
        price:
          type: number
        change:
          type: number
        changePercent:
          type: number
        quantScore:
          type: number
        signal:
          type: string
          enum: [BUY, HOLD, AVOID]
        sentimentScore:
          type: number
        volume:
          type: number
        avgVolume:
          type: number
        rsi:
          type: number
        ma50:
          type: number
        ma200:
          type: number
        macd:
          type: number
        macdSignal:
          type: number
        sector:
          type: ["string", "null"]
        beta:
          type: ["number", "null"]
        annualizedVolatility:
          type: ["number", "null"]
        sharpeRatio:
          type: ["number", "null"]
        maxDrawdown:
          type: ["number", "null"]
        trendScore:
          type: ["number", "null"]
        momentumScore:
          type: ["number", "null"]
        macdScore:
          type: ["number", "null"]
        sentimentContrib:
          type: ["number", "null"]
        volScore:
          type: ["number", "null"]
        volRatio:
          type: ["number", "null"]
        aboveMa50:
          type: ["boolean", "null"]
        aboveMa200:
          type: ["boolean", "null"]
        goldenCross:
          type: ["boolean", "null"]

    MarketPulseItem:
      type: object
      required: [symbol, label, price, change, changePct, change1wPct, change1mPct]
      properties:
        symbol:
          type: string
        label:
          type: string
        price:
          type: number
        change:
          type: number
        changePct:
          type: number
        change1wPct:
          type: number
        change1mPct:
          type: number

    MarketPulse:
      type: object
      required: [indices, sectors, macro, vix, marketMood, rotationNote]
      properties:
        indices:
          type: array
          items:
            $ref: "#/components/schemas/MarketPulseItem"
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/MarketPulseItem"
        macro:
          type: array
          items:
            $ref: "#/components/schemas/MarketPulseItem"
        vix:
          type: number
        marketMood:
          type: string
          enum: [Extreme Fear, Fear, Neutral, Greed, Extreme Greed]
        rotationNote:
          type: string

    PriceBar:
      type: object
      required: [date, open, high, low, close, volume]
      properties:
        date:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
        ma50:
          type: ["number", "null"]
        ma200:
          type: ["number", "null"]
        macd:
          type: ["number", "null"]
        macdSignal:
          type: ["number", "null"]
        rsi:
          type: ["number", "null"]
        bbUpper:
          type: ["number", "null"]
        bbLower:
          type: ["number", "null"]
        bbMa20:
          type: ["number", "null"]

    StockHistory:
      type: object
      required: [ticker, bars]
      properties:
        ticker:
          type: string
        bars:
          type: array
          items:
            $ref: "#/components/schemas/PriceBar"

    Fundamentals:
      type: object
      required: [ticker, name]
      properties:
        ticker:
          type: string
        name:
          type: string
        marketCap:
          type: ["number", "null"]
        pe:
          type: ["number", "null"]
        forwardPe:
          type: ["number", "null"]
        peg:
          type: ["number", "null"]
        priceToBook:
          type: ["number", "null"]
        evToEbitda:
          type: ["number", "null"]
        debtToEquity:
          type: ["number", "null"]
        returnOnEquity:
          type: ["number", "null"]
        returnOnAssets:
          type: ["number", "null"]
        operatingMargins:
          type: ["number", "null"]
        profitMargins:
          type: ["number", "null"]
        beta:
          type: ["number", "null"]
        dividendYield:
          type: ["number", "null"]
        eps:
          type: ["number", "null"]
        bookValuePerShare:
          type: ["number", "null"]
        grahamNumber:
          type: ["number", "null"]
        sector:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        fiftyTwoWeekHigh:
          type: ["number", "null"]
        fiftyTwoWeekLow:
          type: ["number", "null"]
        shortRatio:
          type: ["number", "null"]
        institutionalOwnership:
          type: ["number", "null"]
        shortPercentOfFloat:
          type: ["number", "null"]
        revenueGrowth:
          type: ["number", "null"]
        earningsGrowth:
          type: ["number", "null"]
        currentRatio:
          type: ["number", "null"]
        quickRatio:
          type: ["number", "null"]
        totalRevenue:
          type: ["number", "null"]
        freeCashflow:
          type: ["number", "null"]
        totalDebt:
          type: ["number", "null"]
        totalCash:
          type: ["number", "null"]
        sharesOutstanding:
          type: ["number", "null"]

    NewsItem:
      type: object
      required: [title, url]
      properties:
        title:
          type: string
        url:
          type: string
        publishedAt:
          type: ["string", "null"]
        sentiment:
          type: ["number", "null"]

    NewsData:
      type: object
      required: [ticker, sentimentScore, headlines]
      properties:
        ticker:
          type: string
        sentimentScore:
          type: number
        sentimentLabel:
          type: string
        headlines:
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"

    PeerStock:
      type: object
      required: [ticker]
      properties:
        ticker:
          type: string
        name:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        pe:
          type: ["number", "null"]
        forwardPe:
          type: ["number", "null"]
        dividendYield:
          type: ["number", "null"]
        beta:
          type: ["number", "null"]
        marketCap:
          type: ["number", "null"]
        profitMargins:
          type: ["number", "null"]
        debtToEquity:
          type: ["number", "null"]
        returnOnEquity:
          type: ["number", "null"]

    RelativePerformancePoint:
      type: object
      required: [date]
      properties:
        date:
          type: string

    PeersData:
      type: object
      required: [ticker, sector, peers]
      properties:
        ticker:
          type: string
        sector:
          type: string
        summary:
          type: ["string", "null"]
        peers:
          type: array
          items:
            $ref: "#/components/schemas/PeerStock"
        correlationMatrix:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number

    RecommendationTrendPoint:
      type: object
      required: [period]
      properties:
        period:
          type: string
        strongBuy:
          type: ["number", "null"]
        buy:
          type: ["number", "null"]
        hold:
          type: ["number", "null"]
        sell:
          type: ["number", "null"]
        strongSell:
          type: ["number", "null"]

    AnalystAction:
      type: object
      required: [firm, action]
      properties:
        firm:
          type: string
        toGrade:
          type: ["string", "null"]
        fromGrade:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        action:
          type: string
        priceTargetAction:
          type: ["string", "null"]
        currentPriceTarget:
          type: ["number", "null"]
        priorPriceTarget:
          type: ["number", "null"]

    AnalystData:
      type: object
      required: [ticker, consensusRating, numAnalysts]
      properties:
        ticker:
          type: string
        consensusRating:
          type: string
        numAnalysts:
          type: ["number", "null"]
        currentPrice:
          type: ["number", "null"]
        targetLow:
          type: ["number", "null"]
        targetMean:
          type: ["number", "null"]
        targetHigh:
          type: ["number", "null"]
        recentActions:
          type: array
          items:
            $ref: "#/components/schemas/AnalystAction"
        recommendationTrend:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationTrendPoint"

    InsiderTransaction:
      type: object
      required: [insider, transactionType]
      properties:
        insider:
          type: string
        position:
          type: ["string", "null"]
        transactionType:
          type: string
        shares:
          type: ["number", "null"]
        value:
          type: ["number", "null"]
        text:
          type: ["string", "null"]
        date:
          type: ["string", "null"]
        ownership:
          type: ["string", "null"]

    InsiderPurchases6m:
      type: object
      properties:
        purchaseShares:
          type: ["number", "null"]
        purchaseTrans:
          type: ["number", "null"]
        saleShares:
          type: ["number", "null"]
        saleTrans:
          type: ["number", "null"]

    InsiderData:
      type: object
      required: [ticker, name, netSentiment, buyCount, sellCount, transactions]
      properties:
        ticker:
          type: string
        name:
          type: string
        insiderOwnership:
          type: ["number", "null"]
        institutionalOwnership:
          type: ["number", "null"]
        netSentiment:
          type: string
        buyCount:
          type: number
        sellCount:
          type: number
        purchases6m:
          $ref: "#/components/schemas/InsiderPurchases6m"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/InsiderTransaction"

    UniverseSector:
      type: object
      required: [sector, tickers]
      properties:
        sector:
          type: string
        tickers:
          type: array
          items:
            type: string
